openapi: 3.0.3
info:
  title: F1 Fan Prediction API
  description: A REST API for Formula 1 fans to submit podium predictions for races
  version: 1.0.0
servers:
  - url: /api

tags:
  - name: Auth
    description: Signup and login
  - name: Drivers
    description: F1 driver profiles
  - name: Races
    description: F1 race events
  - name: Predictions
    description: Fan podium predictions

paths:
  /auth/signup:
    post:
      tags: [Auth]
      summary: Create a new user account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '201':
          description: User created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Missing or invalid fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in and receive a JWT token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AuthCredentials'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  token:
                    type: string
                    example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        '400':
          description: Missing email or password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers:
    get:
      tags: [Drivers]
      summary: Get all drivers
      responses:
        '200':
          description: List of all drivers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Driver'
    post:
      tags: [Drivers]
      summary: Create a new driver (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverInput'
      responses:
        '201':
          description: Driver created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Driver with that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /drivers/{id}:
    get:
      tags: [Drivers]
      summary: Get a driver by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Driver found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Drivers]
      summary: Update a driver (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DriverInput'
      responses:
        '200':
          description: Driver updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Driver'
        '400':
          description: Invalid ID or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Drivers]
      summary: Delete a driver (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Driver deleted successfully
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Driver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /races:
    get:
      tags: [Races]
      summary: Get all races
      responses:
        '200':
          description: List of all races
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Race'
    post:
      tags: [Races]
      summary: Create a new race (admin only)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaceInput'
      responses:
        '201':
          description: Race created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Race'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Race with that name already exists
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /races/{id}:
    get:
      tags: [Races]
      summary: Get a race by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Race found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Race'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Race not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Races]
      summary: Update a race (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RaceInput'
      responses:
        '200':
          description: Race updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Race'
        '400':
          description: Invalid ID or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Race not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Races]
      summary: Delete a race (admin only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Race deleted successfully
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Race not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /predictions:
    get:
      tags: [Predictions]
      summary: Get all predictions
      responses:
        '200':
          description: List of all predictions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prediction'
    post:
      tags: [Predictions]
      summary: Create a new prediction (any authenticated user)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionInput'
      responses:
        '201':
          description: Prediction created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
        '400':
          description: Missing required fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Referenced race or driver not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /predictions/{id}:
    get:
      tags: [Predictions]
      summary: Get a prediction by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Prediction found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      tags: [Predictions]
      summary: Update a prediction (owner only)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PredictionUpdateInput'
      responses:
        '200':
          description: Prediction updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prediction'
        '400':
          description: Invalid ID or fields
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the owner of this prediction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Predictions]
      summary: Delete a prediction (owner or admin)
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Prediction deleted successfully
        '400':
          description: Invalid ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not the owner and not an admin
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Prediction not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        example: 1

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          example: Something went wrong

    User:
      type: object
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          example: admin@f1.com
        role:
          type: string
          example: ADMIN

    AuthCredentials:
      type: object
      properties:
        email:
          type: string
          example: admin@f1.com
        password:
          type: string
          example: Admin123!
      required:
        - email
        - password

    Driver:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Max Verstappen
        nationality:
          type: string
          example: Dutch
        team:
          type: string
          example: Red Bull Racing

    DriverInput:
      type: object
      properties:
        name:
          type: string
          example: Max Verstappen
        nationality:
          type: string
          example: Dutch
        team:
          type: string
          example: Red Bull Racing
      required:
        - name
        - nationality
        - team

    Race:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: Monaco Grand Prix
        circuit:
          type: string
          example: Circuit de Monaco
        season:
          type: integer
          example: 2025
        date:
          type: string
          example: '2025-05-25'

    RaceInput:
      type: object
      properties:
        name:
          type: string
          example: Monaco Grand Prix
        circuit:
          type: string
          example: Circuit de Monaco
        season:
          type: integer
          example: 2025
        date:
          type: string
          example: '2025-05-25'
      required:
        - name
        - circuit
        - season
        - date

    Prediction:
      type: object
      properties:
        id:
          type: integer
          example: 1
        userId:
          type: integer
          example: 2
        raceId:
          type: integer
          example: 1
        predictedFirstId:
          type: integer
          example: 1
        predictedSecondId:
          type: integer
          example: 2
        predictedThirdId:
          type: integer
          example: 3
        createdAt:
          type: string
          example: '2025-05-20T09:00:00Z'

    PredictionInput:
      type: object
      properties:
        raceId:
          type: integer
          example: 1
        predictedFirstId:
          type: integer
          example: 1
        predictedSecondId:
          type: integer
          example: 2
        predictedThirdId:
          type: integer
          example: 3
      required:
        - raceId
        - predictedFirstId
        - predictedSecondId
        - predictedThirdId

    PredictionUpdateInput:
      type: object
      properties:
        predictedFirstId:
          type: integer
          example: 3
        predictedSecondId:
          type: integer
          example: 1
        predictedThirdId:
          type: integer
          example: 2